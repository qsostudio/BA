<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscador de Agua — Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    .tab-active   { border-bottom: 2px solid #60a5fa; color: #fff; }
    .tab-inactive { border-bottom: 2px solid transparent; color: rgba(255,255,255,0.5); }
    .tab-inactive:hover { color: rgba(255,255,255,0.8); }
  </style>
</head>
<body class="min-h-screen bg-cover bg-center bg-fixed flex items-center justify-center"
      style="background-image: url('assets/olivar.webp');">

  <div class="w-full max-w-md px-4">
    <div class="card">

      <!-- Logo -->
      <div class="text-center mb-6">
        <div class="text-4xl mb-2">💧</div>
        <h1 class="text-xl font-bold text-white">Buscador de Agua Subterránea</h1>
        <p class="text-white/50 text-xs mt-1">Análisis con IA y satélites</p>
      </div>

      <!-- Tabs -->
      <div class="flex border-b border-white/20 mb-6">
        <button id="tab-login"    class="tab-active flex-1 pb-2 text-sm font-medium transition-all"    onclick="showTab('login')">Iniciar sesión</button>
        <button id="tab-register" class="tab-inactive flex-1 pb-2 text-sm font-medium transition-all" onclick="showTab('register')">Registrarse</button>
        <button id="tab-reset"    class="tab-inactive flex-1 pb-2 text-sm font-medium transition-all" onclick="showTab('reset')">Recuperar</button>
      </div>

      <!-- LOGIN -->
      <div id="panel-login">
        <div class="flex flex-col gap-3">
          <div>
            <label class="input-label">Email</label>
            <input id="login-email" type="email" class="input-field" placeholder="tu@email.com"/>
          </div>
          <div>
            <label class="input-label">Contraseña</label>
            <input id="login-password" type="password" class="input-field" placeholder="••••••••"/>
          </div>
          <div id="login-error" class="hidden"></div>
          <button onclick="doLogin()" class="btn-primary w-full mt-2">Entrar</button>
        </div>
      </div>

      <!-- REGISTER -->
      <div id="panel-register" class="hidden">
        <div class="flex flex-col gap-3">
          <div>
            <label class="input-label">Nombre de usuario</label>
            <input id="reg-username" type="text" class="input-field" placeholder="MiNombre"/>
          </div>
          <div>
            <label class="input-label">Email</label>
            <input id="reg-email" type="email" class="input-field" placeholder="tu@email.com"/>
          </div>
          <div>
            <label class="input-label">Contraseña (mínimo 6 caracteres)</label>
            <input id="reg-password" type="password" class="input-field" placeholder="••••••••"/>
          </div>
          <div id="reg-error" class="hidden"></div>
          <button onclick="doRegister()" class="btn-primary w-full mt-2">Crear cuenta</button>
        </div>
      </div>

      <!-- RESET PASSWORD -->
      <div id="panel-reset" class="hidden">
        <!-- Paso 1: pedir código -->
        <div id="reset-step1">
          <p class="text-white/60 text-xs mb-3">
            Introduce tu email y el administrador verá un código en el servidor. Pídele que te lo dé.
          </p>
          <div class="flex flex-col gap-3">
            <div>
              <label class="input-label">Email</label>
              <input id="reset-email" type="email" class="input-field" placeholder="tu@email.com"/>
            </div>
            <div id="reset-error1" class="hidden"></div>
            <button onclick="doForgot()" class="btn-primary w-full">Solicitar código</button>
          </div>
        </div>
        <!-- Paso 2: introducir código y nueva contraseña -->
        <div id="reset-step2" class="hidden">
          <p class="text-white/60 text-xs mb-3">Introduce el código de 6 dígitos que te dio el administrador.</p>
          <div class="flex flex-col gap-3">
            <div>
              <label class="input-label">Código de recuperación</label>
              <input id="reset-codigo" type="text" class="input-field" placeholder="123456" maxlength="6"/>
            </div>
            <div>
              <label class="input-label">Nueva contraseña</label>
              <input id="reset-nueva" type="password" class="input-field" placeholder="••••••••"/>
            </div>
            <div id="reset-error2" class="hidden"></div>
            <button onclick="doReset()" class="btn-primary w-full">Cambiar contraseña</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
   const API = "/api";
   
    function showTab(tab) {
      ["login","register","reset"].forEach(t => {
        document.getElementById(`panel-${t}`).classList.add("hidden");
        document.getElementById(`tab-${t}`).className = "tab-inactive flex-1 pb-2 text-sm font-medium transition-all";
      });
      document.getElementById(`panel-${tab}`).classList.remove("hidden");
      document.getElementById(`tab-${tab}`).className = "tab-active flex-1 pb-2 text-sm font-medium transition-all";
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
      el.classList.remove("hidden");
    }
    function showSuccess(id, msg) {
      const el = document.getElementById(id);
      el.innerHTML = `<div class="alert alert-success">${msg}</div>`;
      el.classList.remove("hidden");
    }

    function guardarSesion(data) {
      localStorage.setItem("token",    data.token);
      localStorage.setItem("role",     data.role);
      localStorage.setItem("username", data.username);
      localStorage.setItem("email",    data.email);
    }

    async function doLogin() {
      const email    = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      if (!email || !password) { showError("login-error", "Rellena todos los campos"); return; }
      try {
        const res  = await fetch(`${API}/auth/login`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { showError("login-error", data.detail || "Error al iniciar sesión"); return; }
        guardarSesion(data);
        window.location.href = "index.html";
      } catch (e) {
        showError("login-error", "No se puede conectar al servidor. ¿Está el backend corriendo?");
      }
    }

    async function doRegister() {
      const username = document.getElementById("reg-username").value.trim();
      const email    = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;
      if (!username || !email || !password) { showError("reg-error", "Rellena todos los campos"); return; }
      try {
        const res  = await fetch(`${API}/auth/register`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, username, password })
        });
        const data = await res.json();
        if (!res.ok) { showError("reg-error", data.detail || "Error al registrarse"); return; }
        guardarSesion(data);
        window.location.href = "index.html";
      } catch (e) {
        showError("reg-error", "No se puede conectar al servidor.");
      }
    }

    async function doForgot() {
      const email = document.getElementById("reset-email").value.trim();
      if (!email) { showError("reset-error1", "Introduce tu email"); return; }
      try {
        await fetch(`${API}/auth/forgot-password`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        showSuccess("reset-error1", "✅ Solicitud enviada. Pide el código al administrador.");
        setTimeout(() => {
          document.getElementById("reset-step1").classList.add("hidden");
          document.getElementById("reset-step2").classList.remove("hidden");
        }, 1500);
      } catch (e) {
        showError("reset-error1", "No se puede conectar al servidor.");
      }
    }

    async function doReset() {
      const email         = document.getElementById("reset-email").value.trim();
      const codigo        = document.getElementById("reset-codigo").value.trim();
      const nueva_password = document.getElementById("reset-nueva").value;
      if (!codigo || !nueva_password) { showError("reset-error2", "Rellena todos los campos"); return; }
      try {
        const res  = await fetch(`${API}/auth/reset-password`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, codigo, nueva_password })
        });
        const data = await res.json();
        if (!res.ok) { showError("reset-error2", data.detail || "Código incorrecto"); return; }
        showSuccess("reset-error2", "✅ Contraseña cambiada. Redirigiendo...");
        setTimeout(() => showTab("login"), 2000);
      } catch (e) {
        showError("reset-error2", "No se puede conectar al servidor.");
      }
    }

    // Enter key support
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const active = document.querySelector('[class*="tab-active"]')?.id;
        if (active === "tab-login")    doLogin();
        if (active === "tab-register") doRegister();
      }
    });

    // Si ya hay sesión, redirigir
    if (localStorage.getItem("token")) {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
